<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/vite.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Box - NFC tag debugging, light sensor monitoring, and file storage testing">
  <meta name="theme-color" content="#0d1117">
  <title>Box</title>
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // Auto-setup kiosk exit receiver when Capacitor is ready
    document.addEventListener('DOMContentLoaded', () => {
      const checkCapacitor = setInterval(() => {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AppKiosk) {
          clearInterval(checkCapacitor);
          window.Capacitor.Plugins.AppKiosk.setupExitReceiver()
            .then(() => console.log('Kiosk exit receiver registered'))
            .catch(e => console.error('Failed to register kiosk exit receiver:', e));
        }
      }, 100);
    });
  </script>
</body>
</html>
